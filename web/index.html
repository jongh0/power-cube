<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <title>충전 상태 - 광교중흥S클래스</title>

  <!-- PWA & Mobile Web App 설정 -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="파워큐브">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <link rel="stylesheet" href="style.css?v=1.4.2">
</head>
<body>
  <main>
    <header>
      <div class="header-main">
        <h1 id="name">충전 상태</h1>
        <span id="badge" class="badge">실시간</span>
      </div>
      <div class="header-sub">
        <p id="addr"></p>
        <span id="updated" class="updated-time">불러오는 중…</span>
      </div>
    </header>

    <div id="msg" class="msg" hidden></div>

    <!-- ⭐ 자주 사용하는 충전기 (최우선 강조 영역 - 최상단 배치) -->
    <section id="fav-section" class="section-block" hidden>
      <div class="section-header">
        <div class="section-title">
          <span class="icon-star">★</span>
          <h2>자주 쓰는 충전기</h2>
        </div>
        <span id="fav-summary" class="fav-badge">0 / 8 가능</span>
      </div>
      <div id="fav-grid" class="fav-grid"></div>
    </section>

    <!-- 전체 통계 숫자 카드 (자주 쓰는 충전기 아래로 이동) -->
    <section id="summary-card" class="summary-card" hidden>
      <div class="summary-numbers">
        <div class="stat available">
          <span class="label">충전 가능</span>
          <span id="stat-available" class="val">-</span>
        </div>
        <div class="stat charging">
          <span class="label">충전 중</span>
          <span id="stat-charging" class="val">-</span>
        </div>
        <div class="stat total">
          <span class="label">전체 콘센트</span>
          <span id="stat-total" class="val">-</span>
        </div>
      </div>
    </section>

    <!-- 전체 목록 -->
    <section class="section-block">
      <div class="section-header">
        <div class="section-title">
          <h2>전체 목록</h2>
        </div>
        <span id="total-count-badge" class="count-badge">53개</span>
      </div>
      <ul id="list" class="list"></ul>
    </section>

    <footer>
      <p class="copyright">파워큐브 이동형 충전기 현황 • 광교중흥S클래스</p>
    </footer>
  </main>

  <!-- 우측 하단 플로팅 새로고침 버튼 -->
  <button id="fab-refresh" class="fab-refresh" type="button" aria-label="새로고침">
    <svg class="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span class="fab-text">새로고침</span>
  </button>

  <script type="module" src="app.js?v=1.4.2"></script>
  <script>
    // PWA 서비스 워커 등록
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('PWA ServiceWorker 등록 성공:', reg.scope);
        }).catch((err) => {
          console.log('PWA ServiceWorker 등록 실패:', err);
        });
      });
    }
  </script>
</body>
</html>
